name: Trim README safety note

on:
  push:
    paths:
      - '.github/workflows/trim-readme-safety-note.yml'

permissions:
  contents: write

jobs:
  trim-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace safety section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = '''# Public Repository Safety

The repository was built privately first so screenshots and artifacts could be reviewed before publication.

Passwords, client secrets, access keys, SAS tokens, connection strings, bearer tokens, private keys, and real credentials are never published.

Identifiers and account details are removed when they provide no analytical value. Lab identities are used throughout the investigation, and displayed KQL results are sanitized where appropriate.
'''
          new = '''**Repository note:** Lab identities are used throughout, and credentials or sensitive tenant information are excluded from published artifacts.
'''
          if old not in text:
              raise SystemExit('Expected README section not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Trim public repository safety note'
          git push
